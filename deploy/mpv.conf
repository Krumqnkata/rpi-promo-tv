# PromoTV: extra mpv options (installed as /etc/promotv/mpv.conf).
# After editing:  sudo systemctl restart promotv

# Draw directly on the HDMI output (no desktop needed).
vo=gpu
gpu-context=drm

# Hardware H.264 decoding on Raspberry Pi 3.
# If videos do not play at all, try:  hwdec=no
hwdec=v4l2m2m-copy

# Sound over HDMI. If there is no sound, list devices with:
#   mpv --audio-device=help
audio-device=alsa/sysdefault:CARD=vc4hdmi

# Fallback if "vo=gpu" shows a black screen: comment the two lines above and use
# vo=drm

# Keep aspect ratio, black bars instead of stretching.
keepaspect=yes
